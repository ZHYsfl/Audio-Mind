- name: recognize_chords_large_vocab
  server: lv_chordia
  category: acoustic_music_feature_analysis
  description:
    function: Recognize a chord timeline with large vocabulary support including 7ths, diminished, augmented, and complex jazz chords.
    recommended_use:
    - complex chord progressions requiring rich vocabulary
    - jazz harmony analysis
    - seventh chords and extended chords
    - chord recognition when autochord's 25-class vocabulary is insufficient
    not_recommended_use:
    - simple major/minor triads (autochord is sufficient and faster)
    - monophonic implied harmony
    - Roman numerals
    - modulation analysis
    - exact bass note / slash chord precision
  input_schema:
    type: object
    properties:
      audio_path:
        type: string
        description: Path to the audio file to analyze.
      chord_dict_name:
        type: string
        enum: [submission, ismir2017, full]
        default: submission
        description: Chord dictionary to use. 'submission' (~170 chords, recommended), 'ismir2017' (~25 chords, MIREX standard), 'full' (~600+ chords, experimental).
    required:
    - audio_path
  tags:
  - mcp
  - lv_chordia
- name: spectral_stats
  server: ffmpeg
  category: acoustic_music_feature_analysis
  description:
    function: Compute FFmpeg spectral statistics over audio.
    recommended_use:
    - FFmpeg spectral statistics
    not_recommended_use:
    - instrument taxonomy
    - source identity
    - music-theory labels
  input_schema:
    type: object
    properties:
      audio_path:
        type: string
    required:
    - audio_path
  tags:
  - mcp
  - ffmpeg
- name: volumedetect
  server: ffmpeg
  category: acoustic_music_feature_analysis
  description:
    function: Compute FFmpeg mean and maximum volume statistics.
    recommended_use:
    - mean and max volume
    not_recommended_use:
    - time-varying loudness
  input_schema:
    type: object
    properties:
      audio_path:
        type: string
    required:
    - audio_path
  tags:
  - mcp
  - ffmpeg
- name: inspect_audio_plots
  server: omni_captioner
  category: frontend_visual_perception
  description:
    function: Generate one combined audio-plot image and ask a VLM for bounded visual-acoustic clues.
    recommended_use:
    - counting visually separable bursts/events
    - visible activity/silence/energy/transient/spectral structure
    not_recommended_use:
    - speech content
    - speaker identity
    - exact pitch names
    - chord recognition
    - instrument taxonomy
    - music-theory labels
    - final answering
    - events without visible acoustic separation
  input_schema:
    type: object
    properties:
      audio_path:
        type: string
        description: Path to the audio file to inspect (REQUIRED)
      question:
        type: string
        description: Original user question for context only; the tool will not answer it directly
      analysis_focus:
        type: string
        description: Specific visual-acoustic uncertainty to inspect, e.g. repeated transients, silent gaps, loudness change,
          or brightness change
      plot_types:
        type: array
        items:
          type: string
          enum:
          - waveform
          - mel_spectrogram
          - rms_energy
          - onset_envelope
          - spectral_rolloff
          - cqt_chroma
          - bpm_curve
        description: Optional selected plot rows. Defaults to waveform, mel_spectrogram, rms_energy, onset_envelope, spectral_rolloff.
      time_range:
        type: object
        properties:
          start:
            type: number
          end:
            type: number
        description: Optional time range in seconds to crop before plotting
    required:
    - audio_path
    - question
    - analysis_focus
  tags:
  - mcp
  - omni_captioner
- name: verify_audio_quality
  server: omni_captioner
  category: frontend_visual_perception
  description:
    function: Use a VLM-style inspection to compare or check audio-processing quality artifacts.
    recommended_use:
    - processing artifacts
    - processed-versus-reference quality check
    not_recommended_use:
    - semantic audio understanding
  input_schema:
    type: object
    properties:
      audio_path:
        type: string
        description: Path to the processed/enhanced audio file to verify (REQUIRED)
      reference_audio_path:
        type: string
        description: 'Optional: Path to original audio for comparison'
      verification_prompt:
        type: string
        description: Specific instructions on what to check (e.g., 'Check for denoising artifacts', 'Compare with reference
          for content loss')
    required:
    - audio_path
    - verification_prompt
  tags:
  - mcp
  - omni_captioner
