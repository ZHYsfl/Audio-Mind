category_order:
- metadata_validation
- audio_derivation
- temporal_segmentation
- speech_and_speaker_processing
- acoustic_music_feature_analysis
- frontend_visual_perception
category_definitions:
  metadata_validation:
    definition: File-level facts such as duration, sample rate, channels, format, and timestamp sanity.
    guideline: Use to validate assumptions. Do not treat as audio-content evidence.
  audio_derivation:
    definition: Tools that create a derived audio artifact by trimming, filtering, denoising, resampling, channel conversion,
      or separation.
    guideline: Use when a derived audio source may help another tool or frontend follow-up. The derived file is not evidence
      by itself.
  temporal_segmentation:
    definition: Tools that locate candidate time regions such as speech, silence, singing/music, or fixed chunks.
    guideline: Treat boundaries as model- or threshold-dependent. Cross-check when the boundary is central.
  speech_and_speaker_processing:
    definition: Specialized ASR, diarization, VAD, and speaker-verification models.
    guideline: Trust most on clean speech-like data. Be cautious on songs, overlap, crowds, noisy media, and processed voices.
  acoustic_music_feature_analysis:
    definition: Numeric acoustic or music features such as energy, pitch, spectrum, tempo, beats, chroma, key, and chords.
    guideline: Use as supporting evidence. Do not map features to semantic labels unless the tool directly supports that abstraction.
  frontend_visual_perception:
    definition: VLM/omni-style inspection of plots or processing quality.
    guideline: Use for bounded perceptual clues and counting visually separable acoustic events; not deterministic measurement
      or final answering.
tools:
