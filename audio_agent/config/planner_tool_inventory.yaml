- name: estimate_tempo_cnn_mirex
  server: tempo_cnn
  category: acoustic_music_feature_analysis
  description:
    function: Estimate the two most likely tempi and their relative salience using Tempo-CNN (MIREX-style). RECOMMENDED for tempo verification because it exposes tempo octave ambiguity (e.g., 52 vs 104 BPM). Outputs tempo1, tempo2, and salience (0-1). If salience < 0.6, both tempi are plausible.
    recommended_use:
    - tempo verification when single-tempo results seem suspicious
    - detecting tempo octave ambiguity
    - cross-checking against other tempo tools
    not_recommended_use:
    - when a single simple BPM answer is sufficient
    - local tempo variation / tempogram
    - beat-level timing
  input_schema:
    type: object
    properties:
      audio_path:
        type: string
        description: Path to the audio file to analyze.
      interpolate:
        type: boolean
        default: false
        description: Enable quadratic interpolation for sub-integer BPM precision.
    required:
    - audio_path
  tags:
  - mcp
  - tempo_cnn
