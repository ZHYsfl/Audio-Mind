[project]
name = "asr-qwen3-tool"
version = "1.0.0"
description = "ASR using Qwen3-ASR-1.7B model for the Audio Agent Framework"
requires-python = ">=3.11"
authors = [
    {name = "Audio Agent Team"}
]

# Dependencies for Qwen3-ASR
# The qwen-asr package provides the official Qwen3-ASR implementation
# Blackwell (RTX 50-series, sm_120) needs CUDA 12.8+ torch wheels.
dependencies = [
    "qwen-asr",  # Official Qwen3-ASR package
    "torch>=2.8.0",
    "torchaudio>=2.8.0",
    "transformers>=4.40.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "accelerate>=0.25.0",  # For device_map support
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

# Build system (required by PEP 518)
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# setuptools configuration
[tool.setuptools]
py-modules = ["server", "model"]

# uv-specific configuration
[tool.uv]
# allow-prereleases = true

# Blackwell (RTX 50-series, sm_120) needs CUDA 12.8+ torch wheels.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
