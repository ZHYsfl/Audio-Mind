[project]
name = "snakers4-silero-vad-tool"
version = "1.0.0"
description = "Silero VAD tool for the Audio Agent Framework"
requires-python = ">=3.11"
dependencies = [
    "numpy<2",
    "silero-vad>=6.2.1",
    "soundfile>=0.13.1",
    "torch>=2.8.0",
    "torchaudio>=2.8.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "model"]

# Blackwell (RTX 50-series, sm_120) needs CUDA 12.8+ torch wheels.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
