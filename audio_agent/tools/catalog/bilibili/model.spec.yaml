tool_id: bilibili
tool_name: Bilibili
task_type: utility
deployment_type: local

repo:
  url: https://github.com/XZXZZX-Ai/bilibili-mcp
  commit: null  # vendored via package.json, pinned to 1.13.1
  description: >
    MCP server for Bilibili: video/creator search, subtitle reading
    (manual CC + AI subtitles, local ASR fallback), comments, chapters,
    favorites and creator content.

weights:
  source: none
  local_path: null
  required: false
  # optional: faster-whisper ASR model installed by the upstream `setup` flow
  # into ~/.bilibili-mcp/asr/ when the user opts in

environment:
  preferred_backend: uv
  python_version: "3.11"
  requires_gpu: false
  system_packages:
    - node

entrypoints:
  import_test: "import server"
  load_test: "import server; assert callable(server.main)"
  infer_test: "./test_env.sh   # MCP handshake + tools/list smoke, no network"

fixture:
  audio: null
  task_specific: false

notes: >
  Acquisition tool, not an inference model. The Python server is a thin
  stdio proxy around the vendored Node MCP server; validation target is
  the MCP handshake and advertised tool list (see test_env.py).
  Credentials are configured by the user via the upstream CLI `setup`
  command; cookie values never enter this repo.
