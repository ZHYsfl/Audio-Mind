[project]
name = "bilibili-tool"
version = "1.0.0"
description = "Bilibili MCP proxy tool: search, subtitles/AI subtitles, comments, chapters, favorites, optional local ASR"
requires-python = ">=3.11"
authors = [
    {name = "Audio Agent", email = "audio-agent@example.com"}
]

# The proxy itself is stdlib-only; the actual server is the vendored
# Node package @xzxzzx/bilibili-mcp (see package.json / setup.sh).
dependencies = []

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
