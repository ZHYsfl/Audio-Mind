[project]
name = "autochord-tool"
version = "1.0.0"
description = "Automatic chord recognition using autochord (BiLSTM-CRF) for the Audio Agent Framework"
requires-python = ">=3.11"
dependencies = [
    "autochord==0.1.4",
    "soundfile>=0.12.1",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "model"]
