tool_id: cjbayron/autochord
tool_name: autochord
task_type: chord_recognition
deployment_type: local

repo:
  url: https://github.com/cjbayron/autochord
  commit: null

weights:
  source: pip
  local_path: null
  required: true
  note: "autochord downloads BiLSTM-CRF chord model from Google Drive on first import to ~/.autochord/"

environment_hint:
  preferred_backend: uv
  python_version: "3.11"
  requires_gpu: false
  system_packages: [ffmpeg, libsndfile1]

phase1_runtime_target:
  Validate the minimal callable path:
  - confirm package is importable
  - trigger model download/load on first import
  - run inference on fixture

entrypoints:
  import_test: "import autochord"
  load_test: "import autochord; autochord.recognize"
  infer_test: "autochord.recognize(fixture_path)"

fixture:
  audio: tests/fixtures/shared/mir/chord_progression_16k_10s.wav
  task_specific: true
  fallback_allowed: true

io_contract:
  input_type: audio_path
  output_type: json
  primary_field: segments
  required_fields: [segments]
  nonempty_fields: [segments]
  json_serializable: true
  segment_schema:
    start_time: float
    end_time: float
    chord: str
