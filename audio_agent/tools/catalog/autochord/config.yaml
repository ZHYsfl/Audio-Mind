name: autochord
description: "Automatic chord recognition using autochord (BiLSTM-CRF). Recognizes major/minor chord progressions with time-localized labels. 25 classes: N + 12 major + 12 minor."
version: "1.0.0"
author: "Audio Agent Team"
tags: ["chord", "harmony", "music", "chord_recognition", "progression"]

server:
  command: [".venv/bin/python", "server.py"]
  working_dir: "."
  env: {}
  resources:
    memory_gb: 2
    gpu: false
    cpu_cores: 2
  lifecycle: "session"
  startup_timeout_sec: 120

tools:
  - name: "recognize_chords"
    description: "Recognize chord progression in an audio file. Returns time-localized chord labels (major/minor triads). Supports 25 chord classes: N (no chord) + 12 major + 12 minor. Useful for answering 'which chord is played', 'what is the chord progression', 'identify the harmony' questions."
    input_schema:
      type: object
      properties:
        audio_path:
          type: string
          description: "Path to the audio file to analyze."
      required: ["audio_path"]

  - name: "healthcheck"
    description: "Check whether the autochord runtime is available."
    input_schema:
      type: object
      properties: {}

notes: |
  Output format:
  {
    "segments": [
      {"start_time": 0.000, "end_time": 2.325, "chord": "C:maj"},
      {"start_time": 2.325, "end_time": 4.651, "chord": "G:min"},
      ...
    ],
    "duration": 10.000
  }

  Chord vocabulary: N, C:maj, Db:maj, D:maj, Eb:maj, E:maj, F:maj, Gb:maj, G:maj, Ab:maj, A:maj, Bb:maj, B:maj, C:min, Db:min, D:min, Eb:min, E:min, F:min, Gb:min, G:min, Ab:min, A:min, Bb:min, B:min
